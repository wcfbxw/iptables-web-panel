    <line x1="795" y1="174" x2="795" y2="278" stroke="#738497" stroke-opacity=".14"/>
    <line x1="980" y1="174" x2="980" y2="278" stroke="#738497" stroke-opacity=".14"/>
    <text x="405" y="207" fill="#6a798a" font-size="11" font-weight="700">总规则</text>
    <text x="405" y="250" fill="#10233e" font-size="27" font-weight="800">12</text>
    <text x="602" y="207" fill="#6a798a" font-size="11" font-weight="700">总流量</text>
    <text x="602" y="250" fill="#10233e" font-size="25" font-weight="800">8.4 GB</text>
    <text x="817" y="207" fill="#6a798a" font-size="11" font-weight="700">TCP 规则</text>
    <text x="817" y="250" fill="#168798" font-size="12" font-weight="800">TCP</text>
    <text x="854" y="250" fill="#10233e" font-size="25" font-weight="800">8</text>
    <text x="1002" y="207" fill="#6a798a" font-size="11" font-weight="700">UDP 规则</text>
    <text x="1002" y="250" fill="#7654b8" font-size="12" font-weight="800">UDP</text>
    <text x="1042" y="250" fill="#10233e" font-size="25" font-weight="800">4</text>
  </g>

  <line x1="384" y1="354" x2="1166" y2="354" stroke="#738497" stroke-opacity=".15"/>
  <text x="405" y="333" fill="#10233e" font-family="Arial, sans-serif" font-size="16" font-weight="800">当前生效规则</text>
  <rect x="1115" y="315" width="30" height="24" rx="6" fill="#176f7c" fill-opacity=".10"/>
  <text x="1123" y="332" fill="#176f7c" font-family="Arial, sans-serif" font-size="12" font-weight="800">12</text>

  <g font-family="Arial, sans-serif">
    <rect x="384" y="354" width="782" height="42" fill="#eaf0f4" fill-opacity=".42"/>
    <text x="405" y="379" fill="#6a798a" font-size="10" font-weight="800">协议</text>
    <text x="474" y="379" fill="#6a798a" font-size="10" font-weight="800">监听端口</text>
    <text x="570" y="379" fill="#6a798a" font-size="10" font-weight="800">目标地址</text>
    <text x="790" y="379" fill="#6a798a" font-size="10" font-weight="800">备注</text>
    <text x="890" y="379" fill="#6a798a" font-size="10" font-weight="800">总流量</text>
    <text x="1000" y="379" fill="#6a798a" font-size="10" font-weight="800">到期时间</text>

    <line x1="384" y1="456" x2="1166" y2="456" stroke="#738497" stroke-opacity=".12"/>
    <rect x="405" y="416" width="44" height="24" rx="6" fill="#2262b7"/>
    <text x="415" y="433" fill="#ffffff" font-size="11" font-weight="800">TCP</text>
    <text x="474" y="433" fill="#10233e" font-size="14" font-weight="800">38342</text>
    <rect x="570" y="411" width="177" height="34" rx="6" fill="#10233e"/>
    <text x="582" y="433" fill="#ffffff" font-size="12" font-weight="700">38.244.38.29 : 16589</text>
    <text x="790" y="433" fill="#6a798a" font-size="12">Web service</text>
    <text x="890" y="433" fill="#2f5660" font-size="12" font-weight="700">1.28 / 10 GB</text>
    <text x="1000" y="433" fill="#657386" font-size="11">2026-09-01</text>
    <rect x="1111" y="413" width="42" height="30" rx="8" fill="#ffffff" fill-opacity=".40" stroke="#c94a58" stroke-opacity=".32"/>
    <text x="1121" y="433" fill="#b53746" font-size="11" font-weight="700">删除</text>

    <line x1="384" y1="518" x2="1166" y2="518" stroke="#738497" stroke-opacity=".12"/>
    <rect x="405" y="478" width="44" height="24" rx="6" fill="#7654b8"/>
    <text x="414" y="495" fill="#ffffff" font-size="11" font-weight="800">UDP</text>
    <text x="474" y="495" fill="#10233e" font-size="14" font-weight="800">443</text>
    <rect x="570" y="473" width="177" height="34" rx="6" fill="#10233e"/>
    <text x="582" y="495" fill="#ffffff" font-size="12" font-weight="700">edge.example.com : 8443</text>
    <text x="790" y="495" fill="#6a798a" font-size="12">Hysteria2</text>
    <text x="890" y="495" fill="#2f5660" font-size="12" font-weight="700">863 MB / 不限</text>
    <text x="1000" y="495" fill="#657386" font-size="11">不限</text>
    <rect x="1111" y="475" width="42" height="30" rx="8" fill="#ffffff" fill-opacity=".40" stroke="#c94a58" stroke-opacity=".32"/>
    <text x="1121" y="495" fill="#b53746" font-size="11" font-weight="700">删除</text>
