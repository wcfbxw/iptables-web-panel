<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Liquid Glass UI preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7ff"/>
      <stop offset="0.38" stop-color="#f7fbff"/>
      <stop offset="0.72" stop-color="#d8f3ee"/>
      <stop offset="1" stop-color="#f4e9ff"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".44" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".58"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#283f5a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg)"/>
  <path d="M0 80 C180 20 300 132 470 74 C650 14 770 44 960 10 L960 0 L0 0 Z" fill="#ffffff" opacity=".38"/>
  <path d="M0 330 C210 250 360 390 540 304 C700 228 790 278 960 214 L960 560 L0 560 Z" fill="#67e8f9" opacity=".13"/>
  <path d="M120 0 L330 560" stroke="#ffffff" stroke-width="30" opacity=".2"/>
  <path d="M610 0 L820 560" stroke="#c4b5fd" stroke-width="34" opacity=".16"/>
  <rect x="40" y="34" width="880" height="58" rx="8" fill="url(#liquid)" stroke="#ffffff" stroke-opacity=".7" filter="url(#soft)"/>
