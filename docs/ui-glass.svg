<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Traffic forwarding liquid glass control panel preview">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeef1"/>
      <stop offset=".48" stop-color="#f4f7f8"/>
      <stop offset=".76" stop-color="#e3eef0"/>
      <stop offset="1" stop-color="#eef0f7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233e"/>
      <stop offset="1" stop-color="#285c68"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#176f7c"/>
      <stop offset="1" stop-color="#188b88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#22374e" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#background)"/>
  <path d="M0 88 L210 0 H385 L112 310 L0 334 Z" fill="#5cb8be" opacity=".13"/>
  <path d="M760 0 H960 L678 382 H494 Z" fill="#ffffff" opacity=".38"/>
  <path d="M1010 0 H1200 V280 L978 372 H838 Z" fill="#8b72d2" opacity=".10"/>

  <rect x="0" y="0" width="1200" height="70" fill="#f2f7fa" fill-opacity=".76" stroke="#738497" stroke-opacity=".16"/>
  <rect x="34" y="15" width="40" height="40" rx="8" fill="url(#brand)" stroke="#ffffff" stroke-opacity=".76"/>
  <text x="46" y="41" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="800">IP</text>
  <text x="90" y="41" fill="#10233e" font-family="Arial, sans-serif" font-size="17" font-weight="800">流量中转管理面板</text>
  <circle cx="1027" cy="35" r="5" fill="#18a46c"/>
  <text x="1040" y="40" fill="#477177" font-family="Arial, sans-serif" font-size="13" font-weight="700">服务在线</text>
  <rect x="1120" y="17" width="50" height="36" rx="8" fill="#ffffff" fill-opacity=".48" stroke="#738497" stroke-opacity=".25"/>
  <text x="1133" y="40" fill="#10233e" font-family="Arial, sans-serif" font-size="13" font-weight="700">退出</text>

  <text x="34" y="145" fill="#10233e" font-family="Arial, sans-serif" font-size="27" font-weight="800">流量中转管理面板</text>

  <g filter="url(#shadow)">
    <rect x="34" y="174" width="330" height="510" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".82"/>
    <rect x="384" y="174" width="782" height="104" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".82"/>
    <rect x="384" y="298" width="782" height="386" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".82"/>
  </g>

  <line x1="34" y1="230" x2="364" y2="230" stroke="#738497" stroke-opacity=".15"/>
  <text x="54" y="208" fill="#10233e" font-family="Arial, sans-serif" font-size="16" font-weight="800">新建转发规则</text>
  <text x="311" y="208" fill="#748293" font-family="Arial, sans-serif" font-size="11" font-weight="700">DNAT</text>

  <g font-family="Arial, sans-serif">
    <text x="54" y="260" fill="#586a7d" font-size="11" font-weight="700">转发协议</text>
    <rect x="54" y="272" width="290" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <text x="67" y="298" fill="#10233e" font-size="13">TCP + UDP 双栈</text>
    <path d="M322 289 l6 6 l6 -6" fill="none" stroke="#586a7d" stroke-width="1.5"/>

    <text x="54" y="340" fill="#586a7d" font-size="11" font-weight="700">监听端口</text>
    <text x="207" y="340" fill="#586a7d" font-size="11" font-weight="700">目标端口</text>
    <rect x="54" y="352" width="137" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <rect x="207" y="352" width="137" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <text x="67" y="378" fill="#10233e" font-size="13">38342</text>
    <text x="220" y="378" fill="#10233e" font-size="13">16589</text>

    <text x="54" y="420" fill="#586a7d" font-size="11" font-weight="700">目标 IP 或域名</text>
    <rect x="54" y="432" width="290" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <text x="67" y="458" fill="#10233e" font-size="13">38.244.38.29</text>

    <text x="54" y="500" fill="#586a7d" font-size="11" font-weight="700">备注信息</text>
    <rect x="54" y="512" width="290" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <text x="67" y="538" fill="#6a798a" font-size="13">Web service</text>

    <text x="54" y="580" fill="#586a7d" font-size="11" font-weight="700">流量上限</text>
    <text x="207" y="580" fill="#586a7d" font-size="11" font-weight="700">到期时间</text>
    <rect x="54" y="592" width="137" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <rect x="207" y="592" width="137" height="42" rx="8" fill="#ffffff" fill-opacity=".54" stroke="#738497" stroke-opacity=".22"/>
    <text x="67" y="618" fill="#10233e" font-size="13">10240 MB</text>
    <text x="220" y="618" fill="#10233e" font-size="12">UTC+8</text>

    <rect x="54" y="650" width="290" height="34" rx="8" fill="url(#primary)"/>
    <text x="143" y="672" fill="#ffffff" font-size="13" font-weight="800">添加转发规则</text>
  </g>

